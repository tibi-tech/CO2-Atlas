[project]
name = "co2-absorption-calculator"
version = "2.0.0"
description = "Estimate monthly vegetation CO2 absorption (CASA NPP model) for any region from satellite data."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "numpy>=1.26",
    "rasterio>=1.4",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyshp>=2.3",
    "openeo>=0.35",
    "httpx>=0.27",
    "pillow>=10.4",
    "reportlab>=4.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI dependency defaults

[tool.ruff.lint.per-file-ignores]
"app/i18n/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
